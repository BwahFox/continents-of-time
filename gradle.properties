org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Minecraft 26.2 ships unobfuscated; Loom 1.17 builds against it without mappings. Java 25 is required.
minecraft_version=26.2
loader_version=0.19.5
loom_version=1.17-SNAPSHOT
fabric_api_version=0.158.0+26.2

# Moderner Beta (MIT) is a runtime dependency: it hosts every era generator; this mod is the atlas around them.
# The same release exists for 26.2 and 1.20.1 (the future backport target). Pinned; its 5.x API is alpha.
moderner_beta_version=5.0.0-alpha.3+26.2-fabric

version=0.1.0
group=dev.continentsoftime

org.gradle.java.home=/usr/lib/jvm/java-25-openjdk
