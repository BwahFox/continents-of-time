// Shared by every Stonecutter node (versions/<mc>/): runs once per Minecraft version with that node's
// gradle.properties. `sc.current.version` is the Minecraft version being built.
plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
}

// Minecraft 26.1+ ships unobfuscated (Loom's plain plugin, no mappings); older versions are obfuscated and are
// built against Mojang's official mappings through Loom's remapping plugin.
def unobfuscated = sc.current.parsed.matches('>=26.1')
apply plugin: unobfuscated ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'

version = "${mod_version}+${sc.current.version}"
base.archivesName = 'continentsoftime'
def javaRelease = (project.property('java_version') as String).toInteger()
def minecraftRange = project.property('minecraft_range') as String

repositories {
	// Loom adds the Minecraft/Fabric repositories automatically.
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${sc.current.version}"
	if (unobfuscated) {
		implementation "net.fabricmc:fabric-loader:${loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
		// Moderner Beta: compiled against and loaded in the dev runtime; NOT bundled — packs install it themselves.
		implementation "maven.modrinth:moderner-beta:${moderner_beta_version}"
	} else {
		mappings loom.officialMojangMappings()
		modImplementation "net.fabricmc:fabric-loader:${loader_version}"
		modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
		modImplementation "maven.modrinth:moderner-beta:${moderner_beta_version}"
	}
}

// The API renames between 1.20.1 and 26.2 that are pure spelling. Stonecutter applies them to the whole source
// tree when a node is built or switched to (and reverses them on the way back); anything that is not a plain
// rename is handled by //? conditions in the code, most of it in dev.continentsoftime.util.Compat.
stonecutter {
	replacements.string(sc.current.parsed.matches('<1.21.11')) {
		replace 'Identifier', 'ResourceLocation'
		replace '.identifier()', '.location()'
		replace 'net.minecraft.util.Util', 'net.minecraft.Util'
	}
	replacements.string(sc.current.parsed.matches('<26.1')) {
		replace 'net.minecraft.client.renderer.block.BlockAndTintGetter', 'net.minecraft.world.level.BlockAndTintGetter'
	}
	replacements.string(sc.current.parsed.matches('<1.21.2')) {
		replace '.getMinY()', '.getMinBuildHeight()'
	}
	// Generators and biome sources are keyed by Codec before 1.20.5, by MapCodec after. Keyed ('map_codec'): only
	// files that opt in with a `//~ map_codec` header line are touched — the two classes that declare such a codec,
	// which write the type fully qualified so the rename catches exactly those spots.
	replacements.string(sc.current.parsed.matches('<1.20.5'), 'map_codec') {
		replace 'com.mojang.serialization.MapCodec<', 'com.mojang.serialization./*Map*/Codec<'
		replace 'RecordCodecBuilder.mapCodec(', 'RecordCodecBuilder.create('
	}
}

// The test source set holds JavaExec harnesses (no Minecraft needed), not JUnit tests.
tasks.named("test") {
	failOnNoDiscoveredTests = false
}

// Layout harness: builds the atlas layout for a few seeds, asserts its guarantees, writes build/layout/<seed>.png.
// `./gradlew layoutTest -Pseeds=1,2,3` picks the seeds (runs for every version; `:26.2:layoutTest` for one).
tasks.register("layoutTest", JavaExec) {
	group = "verification"
	description = "Checks the continent layout headlessly (determinism, extents, gaps, every era seated) and renders maps."
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "dev.continentsoftime.layout.LayoutHarness"
	workingDir = rootProject.projectDir
	if (project.hasProperty("seeds")) {
		systemProperty "seeds", project.property("seeds")
	}
}

// Climate harness: the client's composite climate sampler over the layout, checked with stub era samplers.
tasks.register("climateTest", JavaExec) {
	group = "verification"
	description = "Checks the client's per-continent climate routing headlessly (stub samplers, real layout, payload codec)."
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "dev.continentsoftime.climate.ClimateHarness"
	workingDir = rootProject.projectDir
	if (project.hasProperty("seeds")) {
		systemProperty "seeds", project.property("seeds")
	}
}

// Timeline harness: era versions, and which vanilla structure sets and cave biomes each era allows.
tasks.register("timelineTest", JavaExec) {
	group = "verification"
	description = "Checks era versions and the era-accurate structure filter headlessly."
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "dev.continentsoftime.timeline.TimelineHarness"
	workingDir = rootProject.projectDir
}

// The access widener names Minecraft's members in the game's own names on 26.2 ("official") and in Mojang's
// mappings on 1.20.1 ("named") — identical lines, different header — so each version has its own file.
def accessWidener = unobfuscated ? 'continentsoftime.accesswidener' : 'continentsoftime-named.accesswidener'

loom {
	accessWidenerPath = rootProject.file("src/main/resources/${accessWidener}")
	// Loom 1.17 remaps mixin targets in the jar itself; no annotation processor, no refmap.

	// Run directories are per Minecraft version: run/<mc>/server and run/<mc>/client at the repository root.
	runs {
		server {
			runDir "../../run/${sc.current.version}/server"
		}
		client {
			// The dev client: `./gradlew :<mc>:runClient`. Fabric API and Moderner Beta are on its classpath already.
			// `--args="--quickPlaySingleplayer <save>"` loads a world in run/<mc>/client/saves directly.
			runDir "../../run/${sc.current.version}/client"
			environmentVariable("__GL_THREADED_OPTIMIZATIONS", "0")
		}
	}
}

processResources {
	def expansion = [
		version: project.version,
		minecraft_range: minecraftRange,
		java_version: javaRelease,
		access_widener: accessWidener,
	]
	inputs.properties expansion

	filesMatching(["fabric.mod.json", "continentsoftime.mixins.json"]) {
		expand expansion
	}
	// Only the selected access widener ships.
	exclude { it.name.endsWith('.accesswidener') && it.name != accessWidener }
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaRelease
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.toVersion(javaRelease)
	targetCompatibility = JavaVersion.toVersion(javaRelease)
}

jar {
	def projectName = base.archivesName.get()
	inputs.property "projectName", projectName

	from(rootProject.file("COPYING.LESSER")) {
		rename { "${it}_$projectName" }
	}
}
