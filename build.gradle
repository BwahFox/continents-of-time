plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	// Loom adds the Minecraft/Fabric repositories automatically.
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Moderner Beta: compiled against and loaded in the dev runtime; NOT bundled — packs install it themselves.
	implementation "maven.modrinth:moderner-beta:${project.moderner_beta_version}"
}

// The test source set holds JavaExec harnesses (no Minecraft needed), not JUnit tests.
tasks.named("test") {
	failOnNoDiscoveredTests = false
}

// Layout harness: builds the atlas layout for a few seeds, asserts its guarantees, writes build/layout/<seed>.png.
// `./gradlew layoutTest -Pseeds=1,2,3` picks the seeds.
tasks.register("layoutTest", JavaExec) {
	group = "verification"
	description = "Checks the continent layout headlessly (determinism, extents, gaps, every era seated) and renders maps."
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "dev.continentsoftime.layout.LayoutHarness"
	workingDir = projectDir
	if (project.hasProperty("seeds")) {
		systemProperty "seeds", project.property("seeds")
	}
}

// Climate harness: the client's composite climate sampler over the layout, checked with stub era samplers.
tasks.register("climateTest", JavaExec) {
	group = "verification"
	description = "Checks the client's per-continent climate routing headlessly (stub samplers, real layout, payload codec)."
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "dev.continentsoftime.climate.ClimateHarness"
	workingDir = projectDir
	if (project.hasProperty("seeds")) {
		systemProperty "seeds", project.property("seeds")
	}
}

loom {
	accessWidenerPath = file("src/main/resources/continentsoftime.accesswidener")

	runs {
		server {
			runDir "run/server"
		}
		client {
			// The dev client: `./gradlew runClient`. Fabric API and Moderner Beta are on its classpath already.
			// `--args="--quickPlaySingleplayer <save>"` loads a world in run/client/saves directly.
			runDir "run/client"
			environmentVariable("__GL_THREADED_OPTIMIZATIONS", "0")
		}
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("COPYING.LESSER") {
		rename { "${it}_$projectName" }
	}
}
